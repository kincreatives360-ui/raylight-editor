name: Parity Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reference-url:
        description: 'Reference app URL to test against'
        required: true
        type: string
      viewport:
        description: 'Viewport to test (comma-separated)'
        required: false
        default: '375,768,1440'
        type: string

env:
  NODE_VERSION: '20'
  REFERENCE_URL: ${{ github.event.inputs.reference-url || vars.REFERENCE_URL }}
  VIEWPORTS: ${{ github.event.inputs.viewport || '375,768,1440' }}

jobs:
  doctor:
    name: Environment Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run doctor
        run: npm run doctor

  recon:
    name: Recon & Baseline Capture
    needs: doctor
    runs-on: ubuntu-latest
    if: inputs.reference-url != '' || vars.REFERENCE_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Scaffold workspace
        run: npx reverse-engineer scaffold baseline --tier impl
      - name: Run recon
        run: |
          npx reverse-engineer recon "$REFERENCE_URL" ./re-baseline \
            --format json \
            --json-out ./re-baseline/recon-summary.json \
            --width 1440 \
            --headless new
      - name: Capture visual baseline
        run: |
          npx reverse-engineer visual-diff "$REFERENCE_URL" ./re-baseline/06-parity/ref \
            --widths "$VIEWPORTS" \
            --headless new
      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baseline
          path: |
            re-baseline/01-recon/
            re-baseline/02-evidence/home/
            re-baseline/06-parity/ref/
          retention-days: 30

  rebuild:
    name: Build & Test
    needs: doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install
      - name: Run build
        run: |
          # Replace with your actual build command
          # npm run build
          echo "Add your build step here"
      - name: Run tests
        run: |
          # Replace with your actual test command
          # npm test
          echo "Add your test step here"

  parity:
    name: Parity Verification
    needs: [recon, rebuild]
    runs-on: ubuntu-latest
    if: (inputs.reference-url != '' || vars.REFERENCE_URL != '') && !failure() && !cancelled() && needs.rebuild.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Download baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: baseline
          path: re-baseline
      - name: Start app
        run: |
          npm run start &
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "App is ready at http://localhost:3000"
              break
            fi
            sleep 1
          done
      - name: Capture rebuild visual
        run: |
          npx reverse-engineer visual-diff "http://localhost:3000" ./re-baseline/06-parity/build \
            --widths "$VIEWPORTS" \
            --headless new
      - name: Run visual diff
        run: |
          for w in $(echo "$VIEWPORTS" | tr ',' ' '); do
            npx reverse-engineer visual-diff --diff \
              ./re-baseline/06-parity/ref/vp-${w}.png \
              ./re-baseline/06-parity/build/vp-${w}.png \
              --out ./re-baseline/06-parity/diff-${w}.png \
              --threshold 0.1
          done
      - name: DOM inventory diff
        run: |
          # Capture rebuild inventory
          npx reverse-engineer inventory "http://localhost:3000" ./re-baseline/02-evidence/build \
            --headless new
          # Diff inventories
          npx reverse-engineer diff \
            ./re-baseline/02-evidence/home/inventory.json \
            ./re-baseline/02-evidence/build/inventory.json \
            --out ./re-baseline/06-parity/diff-inventory.md
      - name: Lint cards
        run: |
          if [ -f ./re-baseline/IMPLEMENTATION.md ]; then
            npx reverse-engineer lint-cards ./re-baseline/IMPLEMENTATION.md
          fi
      - name: Upload diff artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parity-diffs
          path: |
            re-baseline/06-parity/diff-*.png
            re-baseline/06-parity/diff-inventory.md
          retention-days: 30
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## Parity Verification Results\n\n';
            
            // Check visual diffs
            const diffs = ['375', '768', '1440'].map(w => {
              try {
                const diffPath = `./re-baseline/06-parity/diff-${w}.png`;
                if (fs.existsSync(diffPath)) {
                  const stats = fs.statSync(diffPath);
                  return `- **${w}px**: Diff image generated (${(stats.size/1024).toFixed(1)} KB)`;
                }
              } catch (e) {}
              return `- **${w}px**: No diff generated`;
            }).join('\n');
            
            comment += `### Visual Diffs\n${diffs}\n\n`;
            
            // Check inventory diff
            if (fs.existsSync('./re-baseline/06-parity/diff-inventory.md')) {
              const diffContent = fs.readFileSync('./re-baseline/06-parity/diff-inventory.md', 'utf8');
              const lines = diffContent.split('\n').slice(0, 20).join('\n');
              comment += `### DOM Inventory Diff\n\`\`\`\n${lines}\n\`\`\`\n`;
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  notify:
    name: Notify on Failure
    needs: parity
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "Parity verification failed. Check workflow run for details."
          # Add your notification logic here (Slack, email, etc.)
